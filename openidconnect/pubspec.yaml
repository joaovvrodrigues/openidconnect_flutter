name: openidconnect
description: OpenIdConnect library for flutter.
version: 1.0.44
homepage: https://github.com/4D-Technologies/openidconnect_flutter

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  material_ui: ^1.11.1
  openidconnect_platform_interface: ^1.0.17
  openidconnect_web: ^1.0.26
  # openidconnect_windows: ^0.0.6
  jwt_decoder: ^2.0.1

  url_launcher: ^6.3.3
  http: ^1.6.0
  retry: ^3.1.2

  # TODO Remove these once native implementations can be added. Refactor so that the native implementations don't need to do the full cycle through.
  webview_flutter: ^4.14.1
  encrypt_shared_preferences: ^1.0.1
  cryptography_plus: ^3.0.0

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  shared_preferences_platform_interface: ^2.4.2
  webview_flutter_platform_interface: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      web:
        default_package: openidconnect_web
      # windows:
      #   default_package: openidconnect_windows
